name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below so we can reproduce and fix it quickly.

  - type: input
    id: version
    attributes:
      label: "BonniePDF (NuGet) version"
      placeholder: "e.g. 2026.4.1"
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Target framework
      options:
        - .NET 8
        - .NET 9
        - .NET 10
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Paste the smallest snippet of C# that triggers the bug.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output / behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output / error
      description: Include the full exception message and stack trace if available.
