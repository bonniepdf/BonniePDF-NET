name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty for auto)'
        required: false
        type: string

# Serialize releases so two quick tag pushes can't publish concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read   # checkout
  actions: write   # delete prior workflow runs

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    # Delete this workflow's prior runs before doing anything else, so the
    # Actions tab only ever shows the current run. Best-effort: never block
    # the publish if the cleanup API call hiccups.
    - name: Delete prior workflow runs
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run list \
          --repo "${{ github.repository }}" \
          --workflow publish.yml \
          --json databaseId \
          --jq '.[].databaseId' \
          --limit 100 \
        | grep -v '^${{ github.run_id }}$' \
        | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}

    - uses: actions/checkout@v4

    - name: Require cross-engine gallery validation
      env:
        GH_TOKEN: ${{ secrets.PARITY_WORKFLOW_TOKEN }}
        PARITY_WORKFLOW_REPOSITORY: ${{ vars.PARITY_WORKFLOW_REPOSITORY }}
        GALLERY_ENGINE: dotnet
      run: bash scripts/verify-gallery-gate.sh

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        
    - name: Update Version
      run: |
        chmod +x scripts/update-versions.sh
        if [ -n "${{ github.event.inputs.version }}" ]; then
          ./scripts/update-versions.sh --version "${{ github.event.inputs.version }}"
        else
          ./scripts/update-versions.sh
        fi
        
    - name: Restore dependencies
      run: dotnet restore BonniePDF/BonniePDF.csproj
      
    - name: Build
      run: dotnet build BonniePDF/BonniePDF.csproj --configuration Release --no-restore
      
    - name: Pack
      run: dotnet pack BonniePDF/BonniePDF.csproj --configuration Release --no-build --output nupkgs
      
    - name: Push to NuGet
      run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
