name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .NET

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore BonniePDF/BonniePDF.csproj
      
    - name: Build
      run: dotnet build BonniePDF/BonniePDF.csproj --configuration Release --no-restore
      
    - name: Pack
      run: dotnet pack BonniePDF/BonniePDF.csproj --configuration Release --no-build --output nupkgs
      
    - name: Push to NuGet
      run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
