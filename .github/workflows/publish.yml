name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v2026.11.13)'
        required: true
        type: string

# Serialize a tag push and manual retries of the same release.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write  # checkout + create GitHub release
  id-token: write  # NuGet OIDC trusted publishing

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
    - name: Check publish configuration
      env:
        RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        NUGET_USER: ${{ vars.NUGET_USER }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
          echo '::error::Enter an existing BonniePDF release tag such as v2026.11.13.'
          exit 1
        fi
        if [[ -z "$NUGET_USER" || "$NUGET_USER" == *@* ]]; then
          echo '::error::Set the repository variable NUGET_USER to the NuGet.org profile name of the person who created the Trusted Publishing policy. See .github/nuget-publishing.md.'
          exit 1
        fi
        printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Select the tagged source
      run: |
        release_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
        if ! git merge-base --is-ancestor "$release_commit" "$GITHUB_SHA"; then
          echo "::error::Tag $RELEASE_TAG is not reachable from the selected source."
          exit 1
        fi
        git switch --detach "$release_commit"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        
    - name: Check the tag matches the package version
      run: |
        version=$(dotnet msbuild BonniePDF/BonniePDF.csproj -getProperty:PackageVersion)
        if [[ "$version" != "${RELEASE_TAG#v}" ]]; then
          echo "::error::Tag $RELEASE_TAG does not match BonniePDF package version $version."
          exit 1
        fi

    - name: Require cross-engine gallery validation
      env:
        GH_TOKEN: ${{ secrets.PARITY_WORKFLOW_TOKEN }}
        PARITY_WORKFLOW_REPOSITORY: ${{ vars.PARITY_WORKFLOW_REPOSITORY }}
        GALLERY_ENGINE: dotnet
      run: GITHUB_SHA="$(git rev-parse HEAD)" bash scripts/verify-gallery-gate.sh
        
    - name: Restore dependencies
      run: dotnet restore BonniePDF/BonniePDF.csproj
      
    - name: Build
      run: dotnet build BonniePDF/BonniePDF.csproj --configuration Release --no-restore
      
    - name: Pack
      run: dotnet pack BonniePDF/BonniePDF.csproj --configuration Release --no-build --output nupkgs
      
    - name: NuGet login (Trusted Publishing)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push nupkgs/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Extract release notes from CHANGELOG.md
      run: |
        VERSION="${RELEASE_TAG#v}"
        awk -v v="## $VERSION" '
          $0 == v { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "No '## $VERSION' section in CHANGELOG.md; releasing without notes."
          echo "See CHANGELOG.md." > release-notes.md
        fi
        cat release-notes.md

    - name: Publish the GitHub release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        package="nupkgs/BonniePDF.${RELEASE_TAG#v}.nupkg"
        release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
          | jq -c --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag)')
        if [[ -n "$release" ]]; then
          if jq -e --arg name "${package##*/}" 'any(.assets[]; .name == $name)' <<< "$release" > /dev/null; then
            echo "Release $RELEASE_TAG already has ${package##*/}."
          else
            gh release upload "$RELEASE_TAG" "$package" --repo "$GITHUB_REPOSITORY"
          fi
          exit 0
        fi
        flags=()
        if grep -Fxq 'Status: Prerelease' release-notes.md; then flags+=(--prerelease); fi
        gh release create "$RELEASE_TAG" "$package" --verify-tag "${flags[@]}" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$RELEASE_TAG" \
          --notes-file release-notes.md
