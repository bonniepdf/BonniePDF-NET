name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore BonniePDF.Tests/BonniePDF.Tests.csproj

    - name: Build
      run: dotnet build BonniePDF.Tests/BonniePDF.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test BonniePDF.Tests/BonniePDF.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Pack
      run: dotnet pack BonniePDF/BonniePDF.csproj --configuration Release --output nupkgs
