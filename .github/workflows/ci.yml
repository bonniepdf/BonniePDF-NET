name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Delete this workflow's prior runs before doing anything else, so the
    # Actions tab only ever shows the current run. Best-effort: never block
    # the real job if the cleanup API call hiccups.
    - name: Delete prior workflow runs
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run list \
          --repo "${{ github.repository }}" \
          --workflow ci.yml \
          --json databaseId \
          --jq '.[].databaseId' \
          --limit 100 \
        | grep -v '^${{ github.run_id }}$' \
        | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}

    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore BonniePDF.Tests/BonniePDF.Tests.csproj

    - name: Build
      run: dotnet build BonniePDF.Tests/BonniePDF.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test BonniePDF.Tests/BonniePDF.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Test image processing without hardware intrinsics
      env:
        DOTNET_EnableHWIntrinsic: '0'
      run: dotnet test BonniePDF.Tests/BonniePDF.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~Image|FullyQualifiedName~PngPixelOperations" --verbosity normal

    - name: Pack
      run: dotnet pack BonniePDF/BonniePDF.csproj --configuration Release --output nupkgs

    # Smoke-test the produced package: confirm a .nupkg exists and actually
    # contains the compiled assembly (catches an empty/broken pack before it
    # ever reaches a release tag).
    - name: Verify package contents
      run: |
        set -euo pipefail
        nupkg=$(ls nupkgs/*.nupkg | head -n1)
        echo "Inspecting $nupkg"
        for tfm in net8.0 net10.0; do
          unzip -l "$nupkg" | grep -q "lib/$tfm/BonniePDF.dll" \
            || { echo "::error::BonniePDF.dll ($tfm) missing from package"; exit 1; }
        done
        unzip -l "$nupkg" | grep -q "assets/unicode/LICENSE.txt" \
          || { echo "::error::Unicode license missing from package"; exit 1; }
        echo "Package contains BonniePDF.dll for net8.0 and net10.0 ✓"

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: nupkgs/*.nupkg
        retention-days: 14

  image-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Test image processing on ARM64
      run: dotnet test BonniePDF.Tests/BonniePDF.Tests.csproj --configuration Release --filter "FullyQualifiedName~Image|FullyQualifiedName~PngPixelOperations" --verbosity normal
