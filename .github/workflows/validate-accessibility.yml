name: PDF/UA-1 Validation

# Compliance gate: builds the library, generates the tagged example PDFs, and
# validates every one against PDF/UA-1 with veraPDF. The job fails if any PDF
# is non-compliant (tools/verapdf/validate.sh exits non-zero), so a regression
# cannot reach master. See docs/ci/pdf-validation.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Generate & validate (UA-1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # JDK + Maven power the veraPDF gate (tools/verapdf).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Avoids re-resolving the veraPDF engine from Maven Central and
      # recompiling Validate.java on every run.
      - name: Cache veraPDF engine
        uses: actions/cache@v4
        with:
          path: |
            tools/verapdf/lib
            tools/verapdf/Validate.class
          key: verapdf-${{ runner.os }}-${{ hashFiles('tools/verapdf/pom.xml', 'tools/verapdf/Validate.java') }}

      - name: Build the tagged-example projects
        run: |
          dotnet build Examples/BonniePDF.Examples.Basics.SimpleDocument -c Release
          dotnet build Examples/BonniePDF.Examples.Templates.BusinessInvoice -c Release
          dotnet build Examples/BonniePDF.Examples.Elements.Images -c Release

      - name: Generate tagged example PDFs
        run: |
          dotnet run --project Examples/BonniePDF.Examples.Basics.SimpleDocument -c Release --no-build
          dotnet run --project Examples/BonniePDF.Examples.Templates.BusinessInvoice -c Release --no-build
          dotnet run --project Examples/BonniePDF.Examples.Elements.Images -c Release --no-build

      - name: Collect tagged PDFs
        run: |
          mkdir -p generated-pdfs
          # The example programs write to <project>/bin/.../GeneratedPdfs/.
          find Examples -path '*/GeneratedPdfs/simple_document_tagged.pdf' -exec cp {} generated-pdfs/ \;
          find Examples -path '*/GeneratedPdfs/invoice.pdf' -exec cp {} generated-pdfs/ \;
          find Examples -path '*/GeneratedPdfs/images_tagged.pdf' -exec cp {} generated-pdfs/ \;
          ls -l generated-pdfs

      - name: Validate with veraPDF (PDF/UA-1)
        run: tools/verapdf/validate.sh generated-pdfs ua1

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pdfs
          path: generated-pdfs/
          retention-days: 14

      - name: Comment veraPDF results on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: verapdf-ua1
          path: verapdf-summary.md
