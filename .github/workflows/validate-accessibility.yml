name: PDF Conformance Validation

# Compliance gate: builds the library, generates the conformance fixtures, and
# validates every claimed PDF/A and PDF/UA conformance level with veraPDF. The
# job fails if any PDF is non-compliant (tools/verapdf/validate.sh exits
# non-zero), so a regression cannot reach master. See docs/ci/pdf-validation.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Generate & validate claimed conformance
    runs-on: ubuntu-latest

    steps:
      # Delete this workflow's prior runs before doing anything else, so the
      # Actions tab only ever shows the current run. Best-effort: never block
      # the real job if the cleanup API call hiccups.
      - name: Delete prior workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow validate-accessibility.yml \
            --json databaseId \
            --jq '.[].databaseId' \
            --limit 100 \
          | grep -v '^${{ github.run_id }}$' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # JDK + Maven power the veraPDF gate (tools/verapdf).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Avoids re-resolving the veraPDF engine from Maven Central and
      # recompiling Validate.java on every run.
      - name: Cache veraPDF engine
        uses: actions/cache@v4
        with:
          path: |
            tools/verapdf/lib
            tools/verapdf/Validate.class
          key: verapdf-${{ runner.os }}-${{ hashFiles('tools/verapdf/pom.xml', 'tools/verapdf/Validate.java') }}

      # Build and run every example project, however deep it sits (Examples/<tier>/<project>/).
      # Each writes its PDFs to <project>/bin/.../GeneratedPdfs/. Finding the .csproj
      # files means a new example project is picked up automatically - no edit needed
      # here, and non-project folders (e.g. Examples/assets) are skipped. Every project
      # runs to completion in a few seconds, so a failure here is a real failure.
      - name: Generate all example PDFs
        run: |
          for csproj in $(find Examples -name '*.csproj' -not -path '*/obj/*' | sort); do
            echo "::group::${csproj}"
            dotnet run --project "$csproj" -c Release
            echo "::endgroup::"
          done

      - name: Collect conformance-claiming PDFs
        run: |
          mkdir -p generated-pdfs
          # PDF/UA-1 examples write their tagged output as *_tagged.pdf into
          # GeneratedPdfs/. Collect every one — any new tagged example is
          # included automatically, with no change to this workflow.
          find Examples -path '*/GeneratedPdfs/*_tagged.pdf' -exec cp {} generated-pdfs/ \;
          # PDF/A-3 examples (attachments / Factur-X) are not tagged, so collect
          # them by name. Add new PDF/A example outputs here.
          find Examples -path '*/GeneratedPdfs/factur-x_invoice.pdf' -exec cp {} generated-pdfs/ \;
          find Examples -path '*/GeneratedPdfs/attached-data.pdf' -exec cp {} generated-pdfs/ \;
          # Symmetric baseline fixtures. Each one's XMP claim drives the auto
          # detector: part=3 conformance=A selects veraPDF flavour 3a, part=4
          # selects flavour 4. Without them those levels are never validated,
          # because no example document claims them.
          find Examples -path '*/GeneratedPdfs/pdfa1b_baseline.pdf' -exec cp {} generated-pdfs/ \;
          find Examples -path '*/GeneratedPdfs/pdfa1a_baseline.pdf' -exec cp {} generated-pdfs/ \;
          find Examples -path '*/GeneratedPdfs/pdfa3a_baseline.pdf' -exec cp {} generated-pdfs/ \;
          find Examples -path '*/GeneratedPdfs/pdfa4_baseline.pdf' -exec cp {} generated-pdfs/ \;
          test -s generated-pdfs/pdfa1b_baseline.pdf
          test -s generated-pdfs/pdfa1a_baseline.pdf
          test -s generated-pdfs/pdfa3a_baseline.pdf
          test -s generated-pdfs/pdfa4_baseline.pdf
          ls -l generated-pdfs

      # `auto` reads each PDF's XMP conformance claims (pdfaid + pdfuaid) and
      # validates every level it claims - so a PDF/A regression is caught, and a
      # file that lost its claim fails instead of silently passing.

      # Fail fast with a clear message if validate.sh lost its executable bit
      # (mode 100644 instead of 100755) - otherwise the validate step below
      # dies with an opaque exit-126 "Permission denied". See
      # docs/developer/ci/workflow-maintenance.
      - name: Verify validate.sh is executable
        run: |
          mode=$(git ls-files -s tools/verapdf/validate.sh | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::tools/verapdf/validate.sh has mode $mode, expected 100755. Fix with: git update-index --chmod=+x tools/verapdf/validate.sh"
            exit 1
          fi

      - name: Validate with veraPDF (auto-detected claims)
        run: tools/verapdf/validate.sh generated-pdfs auto

      # ── ZUGFeRD / Factur-X gate (Mustang) ────────────────────────────────
      # veraPDF proves PDF/A-3b; Mustang additionally validates the embedded
      # CII XML against the EN 16931 schematron. PDF/A passing alone is not a
      # valid e-invoice claim.
      - name: Cache Mustang CLI
        uses: actions/cache@v4
        with:
          path: tools/mustang/*.jar
          key: mustang-${{ runner.os }}-${{ hashFiles('tools/mustang/validate.sh') }}

      - name: Verify mustang validate.sh is executable
        run: |
          mode=$(git ls-files -s tools/mustang/validate.sh | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::tools/mustang/validate.sh has mode $mode, expected 100755. Fix with: git update-index --chmod=+x tools/mustang/validate.sh"
            exit 1
          fi

      - name: Validate ZUGFeRD / Factur-X with Mustang
        run: tools/mustang/validate.sh generated-pdfs/factur-x_invoice.pdf

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pdfs
          path: generated-pdfs/
          retention-days: 14
