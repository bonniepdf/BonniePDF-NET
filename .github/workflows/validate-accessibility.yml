name: PDF Conformance Validation

# Compliance gate: builds the library, generates the tagged example PDFs, and
# validates every claimed PDF/A and PDF/UA conformance level with veraPDF. The
# job fails if any PDF is non-compliant (tools/verapdf/validate.sh exits
# non-zero), so a regression cannot reach master. See docs/ci/pdf-validation.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Generate & validate claimed conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # JDK + Maven power the veraPDF gate (tools/verapdf).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Avoids re-resolving the veraPDF engine from Maven Central and
      # recompiling Validate.java on every run.
      - name: Cache veraPDF engine
        uses: actions/cache@v4
        with:
          path: |
            tools/verapdf/lib
            tools/verapdf/Validate.class
          key: verapdf-${{ runner.os }}-${{ hashFiles('tools/verapdf/pom.xml', 'tools/verapdf/Validate.java') }}

      # Build and run every example project. Each writes its PDFs to
      # <project>/bin/.../GeneratedPdfs/. Iterating over the .csproj files means a
      # new example project is picked up automatically — no edit needed here, and
      # non-project folders (e.g. Examples/assets) are skipped.
      - name: Generate all example PDFs
        run: |
          for csproj in Examples/*/*.csproj; do
            echo "::group::${csproj}"
            dotnet run --project "$csproj" -c Release
            echo "::endgroup::"
          done

      - name: Collect tagged PDFs
        run: |
          mkdir -p generated-pdfs
          # PDF/UA-1 examples write their tagged output as *_tagged.pdf into
          # GeneratedPdfs/. Collect every one — any new tagged example is
          # included automatically, with no change to this workflow.
          find Examples -path '*/GeneratedPdfs/*_tagged.pdf' -exec cp {} generated-pdfs/ \;
          # Each tagged PDF is saved with a sibling first-page SVG preview
          # (Document.SaveWithPreview); collect those too so the veraPDF card
          # report can show a thumbnail per file.
          find Examples -path '*/GeneratedPdfs/*_tagged.svg' -exec cp {} generated-pdfs/ \;
          ls -l generated-pdfs

      # `auto` reads each PDF's XMP conformance claims (pdfaid + pdfuaid) and
      # validates every level it claims - so a PDF/A regression is caught, and a
      # file that lost its claim fails instead of silently passing.
      - name: Validate with veraPDF (auto-detected claims)
        run: tools/verapdf/validate.sh generated-pdfs auto

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pdfs
          path: generated-pdfs/
          retention-days: 14

      # Self-contained card report: the HTML plus the first-page SVG previews it
      # references via relative <img src>. Both must travel together for the
      # thumbnails to render when the artifact is downloaded.
      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            generated-pdfs/verapdf-report.html
            generated-pdfs/*.svg
          retention-days: 14
          if-no-files-found: ignore
