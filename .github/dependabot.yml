version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tools:
        patterns:
          - "Meziantou.Analyzer"
          - "Microsoft.NET.Test.*"
          - "xunit*"
          - "coverlet.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
